services:
  - type: web
    name: docai-app
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Ensures the runtime container finds the model pre-cached during build.
      - key: SENTENCE_TRANSFORMERS_HOME
        value: /app/.cache/sentence_transformers
      # Clean Python output in Render logs
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: docai-db
    plan: free
    databaseName: doc_platform
    user: doc_user
